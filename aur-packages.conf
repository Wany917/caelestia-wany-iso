# Paquets AUR embarques dans le depot local de l'ISO.
# pacstrap ne sait pas lire l'AUR : ils doivent etre pre-compiles ici pour que
# l'installation fonctionne hors-ligne.
#
# Un nom de paquet AUR par ligne. # = commentaire.

# Helper AUR : install.fish l'installe lui-meme s'il manque (ce qui exigerait
# du reseau), donc on le fournit.
paru

# Dependances AUR directes du metapackage caelestia-meta
caelestia-cli
caelestia-shell
app2unit
qtengine-git

# Dependances AUR *transitives*. Faciles a oublier : elles n'apparaissent pas dans
# le PKGBUILD de caelestia-meta, seulement plus bas dans l'arbre. Sans elles
# caelestia-shell est ininstallable hors-ligne.
quickshell-git            # caelestia-shell
libcava                   # caelestia-shell (visualiseur audio)
ttf-rubik-vf              # caelestia-shell (police de l'horloge)
python-materialyoucolor   # caelestia-cli (generation des schemes)

# Pour verifier que rien ne manque apres une mise a jour de caelestia :
#   pactree -u caelestia-meta | sort -u > /tmp/tree
#   pacman -Qmq | sort -u > /tmp/aur
#   comm -12 /tmp/tree /tmp/aur
