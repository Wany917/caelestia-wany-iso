# Utilisateur de la session live.
#
# Cree par systemd-sysusers, qui tourne dans sysinit.target : donc bien avant
# multi-user.target et greetd. Auparavant l'utilisateur etait cree par notre
# propre service ordonne avec Before=greetd.service ; sur une machine reelle ca
# n'a pas suffi et greetd a boucle sur
#   error: configured default session user 'caelestia' not found
# jusqu'a start-limit-hit. Passer par sysusers supprime la course entierement.
#
# Hyprland refuse de tourner en root, d'ou cet utilisateur dedie.

u  caelestia  1000  "caelestia live session"  /home/caelestia  /usr/bin/fish

# Groupes supplementaires. 'seat' vient de seatd et conditionne l'acces au
# compositeur ; les autres donnent son, video, peripheriques d'entree et sudo.
m  caelestia  wheel
m  caelestia  audio
m  caelestia  video
m  caelestia  input
m  caelestia  storage
m  caelestia  seat
